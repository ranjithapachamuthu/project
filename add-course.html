<!DOCTYPE html>
<html>
<head>
    <title>Add Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-box">
        <h1>Add New Course</h1>

        <form action="/add-course" method="POST">
            <label>Course Name</label>
            <input type="text" name="course_name"
             placeholder="Enter course name" required>

            <label>Course Description</label>
            <textarea name="description"
             placeholder="Enter course description" required></textarea>

            <label>Course Duration</label>
            <input type="text" name="duration"
            placeholder="Example: 3 Months" required>

            <label>Course Price</label>
            <input type="number" name="price"
            placeholder="Enter course price" min="0" required>

            <label>Instructor Name</label>
            <input type="text" name="instructor"
             placeholder="Enter instructor name" required>

            <button type="submit">Add Course</button>
        </form>

        <p>
            <a href="admin-dashboard.html">Back to Dashboard</a>
        </p>
    </div>

</body>
</html>
